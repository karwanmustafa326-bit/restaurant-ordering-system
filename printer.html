<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printer Management App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out forwards;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }

        .card h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            margin-right: 10px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .printer-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .printer-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .printer-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .printer-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
            line-height: 1.6;
        }

        .printer-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
            margin-right: 5px;
        }

        .status-online {
            background: #d4edda;
            color: #155724;
        }

        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }

        .status-printing {
            background: #cce5ff;
            color: #004085;
        }

        .printer-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .job-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 4px solid #ffc107;
        }

        .job-info {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            animation: fadeIn 0.6s ease-out forwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.15s; }
        .stat-card:nth-child(2) { animation-delay: 0.25s; }
        .stat-card:nth-child(3) { animation-delay: 0.35s; }
        .stat-card:nth-child(4) { animation-delay: 0.45s; }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease-out;
        }

        .modal-header {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 16px;
            color: #999;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 36px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🖨️ Printer Management</h1>
        <p>Manage, monitor, and control your printers effortlessly</p>
    </div>

    <!-- Statistics -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="totalPrinters">0</div>
            <div class="stat-label">Total Printers</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="onlinePrinters">0</div>
            <div class="stat-label">Online</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="printingCount">0</div>
            <div class="stat-label">Printing</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalJobs">0</div>
            <div class="stat-label">Total Jobs</div>
        </div>
    </div>

    <div class="main-grid">
        <!-- Add/Edit Printer -->
        <div class="card">
            <h2>➕ Add Printer</h2>
            <form id="printerForm">
                <div class="form-group">
                    <label for="printerName">Printer Name *</label>
                    <input type="text" id="printerName" placeholder="e.g., Office Printer 1" required>
                </div>

                <div class="form-group">
                    <label for="printerModel">Model *</label>
                    <input type="text" id="printerModel" placeholder="e.g., HP LaserJet Pro" required>
                </div>

                <div class="form-group">
                    <label for="printerIP">IP Address *</label>
                    <input type="text" id="printerIP" placeholder="e.g., 192.168.1.100" required>
                </div>

                <div class="form-group">
                    <label for="printerLocation">Location</label>
                    <input type="text" id="printerLocation" placeholder="e.g., Floor 3, Room 301">
                </div>

                <div class="form-group">
                    <label for="printerType">Type</label>
                    <select id="printerType">
                        <option value="Laser">Laser Printer</option>
                        <option value="Inkjet">Inkjet Printer</option>
                        <option value="3D">3D Printer</option>
                        <option value="Thermal">Thermal Printer</option>
                        <option value="Multifunction">Multifunction</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="printerColor">Color Capability</label>
                    <select id="printerColor">
                        <option value="BW">Black & White</option>
                        <option value="Color">Color</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Add Printer</button>
            </form>
        </div>

        <!-- Print Job Submission -->
        <div class="card">
            <h2>📄 Submit Print Job</h2>
            <form id="jobForm">
                <div class="form-group">
                    <label for="jobPrinter">Select Printer *</label>
                    <select id="jobPrinter" required>
                        <option value="">Choose a printer...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="jobName">Document Name *</label>
                    <input type="text" id="jobName" placeholder="e.g., Report_Q4_2024.pdf" required>
                </div>

                <div class="form-group">
                    <label for="jobPages">Number of Pages *</label>
                    <input type="number" id="jobPages" min="1" placeholder="e.g., 10" required>
                </div>

                <div class="form-group">
                    <label for="jobCopies">Copies</label>
                    <input type="number" id="jobCopies" min="1" value="1">
                </div>

                <div class="form-group">
                    <label for="jobColor">Print in Color</label>
                    <select id="jobColor">
                        <option value="false">Black & White</option>
                        <option value="true">Color</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="jobNotes">Notes</label>
                    <textarea id="jobNotes" placeholder="Add any special instructions..."></textarea>
                </div>

                <button type="submit" class="btn-primary btn-success">Submit Print Job</button>
            </form>
        </div>
    </div>

    <!-- Printers List -->
    <div class="card">
        <h2>🖨️ Printers List</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('all')">All Printers</button>
            <button class="tab-btn" onclick="switchTab('online')">Online</button>
            <button class="tab-btn" onclick="switchTab('offline')">Offline</button>
        </div>
        <div id="allTab" class="tab-content active">
            <div id="printersList"></div>
        </div>
        <div id="onlineTab" class="tab-content">
            <div id="onlinePrintersList"></div>
        </div>
        <div id="offlineTab" class="tab-content">
            <div id="offlinePrintersList"></div>
        </div>
    </div>

    <!-- Print Jobs Queue -->
    <div class="card">
        <h2>📋 Print Jobs Queue</h2>
        <div id="jobsList"></div>
    </div>
</div>

<!-- Print Job Details Modal -->
<div id="jobModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span>Job Details</span>
            <button class="close-btn" onclick="closeJobModal()">&times;</button>
        </div>
        <div id="jobModalContent"></div>
    </div>
</div>

<script>
    let printers = [];
    let printJobs = [];
    let jobIdCounter = 1;

    function generateId() {
        return Date.now() + Math.random().toString(36).substr(2, 9);
    }

    function addPrinter(e) {
        e.preventDefault();

        const printer = {
            id: generateId(),
            name: document.getElementById('printerName').value,
            model: document.getElementById('printerModel').value,
            ip: document.getElementById('printerIP').value,
            location: document.getElementById('printerLocation').value,
            type: document.getElementById('printerType').value,
            color: document.getElementById('printerColor').value,
            status: 'online',
            pagesPrinted: 0,
            addedDate: new Date().toLocaleDateString()
        };

        printers.push(printer);
        document.getElementById('printerForm').reset();
        updateUI();

        showNotification('✅ Printer added successfully!');
    }

    function submitPrintJob(e) {
        e.preventDefault();

        const printerId = document.getElementById('jobPrinter').value;
        const printer = printers.find(p => p.id === printerId);

        if (!printer) {
            showNotification('❌ Please select a valid printer', 'error');
            return;
        }

        const job = {
            id: 'JOB-' + jobIdCounter++,
            printerId: printerId,
            printerName: printer.name,
            documentName: document.getElementById('jobName').value,
            pages: parseInt(document.getElementById('jobPages').value),
            copies: parseInt(document.getElementById('jobCopies').value),
            color: document.getElementById('jobColor').value === 'true',
            notes: document.getElementById('jobNotes').value,
            status: 'queued',
            progress: 0,
            submittedTime: new Date().toLocaleTimeString(),
            submittedDate: new Date().toLocaleDateString()
        };

        printJobs.push(job);
        document.getElementById('jobForm').reset();

        // Simulate job processing
        simulatePrintJob(job);
        updateUI();

        showNotification('✅ Print job submitted successfully!');
    }

    function simulatePrintJob(job) {
        setTimeout(() => {
            const jobIndex = printJobs.findIndex(j => j.id === job.id);
            if (jobIndex !== -1) {
                printJobs[jobIndex].status = 'printing';
                const printer = printers.find(p => p.id === job.printerId);
                if (printer) {
                    printer.status = 'printing';
                }
                updateUI();

                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 25;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        printJobs[jobIndex].status = 'completed';
                        if (printer) {
                            printer.status = 'online';
                            printer.pagesPrinted += job.pages * job.copies;
                        }
                        updateUI();
                        showNotification('✅ Print job completed!');
                    } else {
                        printJobs[jobIndex].progress = Math.min(progress, 99);
                        updateUI();
                    }
                }, 2000);
            }
        }, 1500);
    }

    function deletePrinter(id) {
        if (confirm('Are you sure you want to delete this printer?')) {
            printers = printers.filter(p => p.id !== id);
            updateUI();
            showNotification('🗑️ Printer deleted');
        }
    }

    function togglePrinterStatus(id) {
        const printer = printers.find(p => p.id === id);
        if (printer) {
            printer.status = printer.status === 'online' ? 'offline' : 'online';
            updateUI();
            showNotification(`Printer is now ${printer.status}`);
        }
    }

    function cancelJob(id) {
        if (confirm('Cancel this print job?')) {
            printJobs = printJobs.filter(j => j.id !== id);
            updateUI();
            showNotification('Print job cancelled');
        }
    }

    function showJobDetails(id) {
        const job = printJobs.find(j => j.id === id);
        if (job) {
            const content = `
                <div class="form-group">
                    <p><strong>Job ID:</strong> ${job.id}</p>
                    <p><strong>Printer:</strong> ${job.printerName}</p>
                    <p><strong>Document:</strong> ${job.documentName}</p>
                    <p><strong>Pages:</strong> ${job.pages}</p>
                    <p><strong>Copies:</strong> ${job.copies}</p>
                    <p><strong>Color:</strong> ${job.color ? 'Yes' : 'No'}</p>
                    <p><strong>Status:</strong> <span class="printer-status ${job.status === 'completed' ? 'status-online' : 'status-printing'}">${job.status.toUpperCase()}</span></p>
                    <p><strong>Progress:</strong> ${job.progress}%</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${job.progress}%"></div>
                    </div>
                    <p><strong>Submitted:</strong> ${job.submittedDate} ${job.submittedTime}</p>
                    ${job.notes ? `<p><strong>Notes:</strong> ${job.notes}</p>` : ''}
                </div>
            `;
            document.getElementById('jobModalContent').innerHTML = content;
            document.getElementById('jobModal').classList.add('show');
        }
    }

    function closeJobModal() {
        document.getElementById('jobModal').classList.remove('show');
    }

    function updateJobPrinterSelect() {
        const select = document.getElementById('jobPrinter');
        select.innerHTML = '<option value="">Choose a printer...</option>';
        printers.forEach(p => {
            const option = document.createElement('option');
            option.value = p.id;
            option.textContent = `${p.name} (${p.status})`;
            select.appendChild(option);
        });
    }

    function renderPrintersList(filter = 'all') {
        let filtered = printers;
        if (filter === 'online') {
            filtered = printers.filter(p => p.status === 'online');
        } else if (filter === 'offline') {
            filtered = printers.filter(p => p.status === 'offline');
        }

        let html = '';
        if (filtered.length === 0) {
            html = '<div class="empty-state"><div class="empty-state-icon">🖨️</div><p>No printers found</p></div>';
        } else {
            html = filtered.map(p => `
                <div class="printer-item">
                    <div class="printer-name">${p.name}</div>
                    <div class="printer-info">📋 Model: ${p.model}</div>
                    <div class="printer-info">🌐 IP: ${p.ip}</div>
                    <div class="printer-info">📍 Location: ${p.location || 'N/A'}</div>
                    <div class="printer-info">🎨 Type: ${p.type} (${p.color})</div>
                    <div class="printer-info">📄 Pages Printed: ${p.pagesPrinted}</div>
                    <div class="printer-info">📅 Added: ${p.addedDate}</div>
                    <span class="printer-status ${p.status === 'online' ? 'status-online' : p.status === 'printing' ? 'status-printing' : 'status-offline'}">
                        ${p.status.toUpperCase()}
                    </span>
                    <div class="printer-actions">
                        <button class="btn-secondary" onclick="togglePrinterStatus('${p.id}')">
                            ${p.status === 'online' ? '🔴 Go Offline' : '🟢 Go Online'}
                        </button>
                        <button class="btn-danger" onclick="deletePrinter('${p.id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        return html;
    }

    function renderJobsList() {
        let html = '';
        if (printJobs.length === 0) {
            html = '<div class="empty-state"><div class="empty-state-icon">📋</div><p>No print jobs in queue</p></div>';
        } else {
            html = printJobs.map(j => `
                <div class="job-item">
                    <div class="job-info"><strong>${j.id}</strong> - ${j.documentName}</div>
                    <div class="job-info">🖨️ ${j.printerName} | 📄 ${j.pages} pages × ${j.copies} copies</div>
                    <div class="job-info">Status: <span class="printer-status ${j.status === 'completed' ? 'status-online' : j.status === 'printing' ? 'status-printing' : 'status-offline'}">${j.status.toUpperCase()}</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${j.progress}%"></div>
                    </div>
                    <div class="printer-actions">
                        <button class="btn-secondary" onclick="showJobDetails('${j.id}')">Details</button>
                        <button class="btn-danger" onclick="cancelJob('${j.id}')">Cancel</button>
                    </div>
                </div>
            `).join('');
        }
        return html;
    }

    function updateStats() {
        document.getElementById('totalPrinters').textContent = printers.length;
        document.getElementById('onlinePrinters').textContent = printers.filter(p => p.status === 'online').length;
        document.getElementById('printingCount').textContent = printers.filter(p => p.status === 'printing').length;
        document.getElementById('totalJobs').textContent = printJobs.length;
    }

    function updateUI() {
        document.getElementById('printersList').innerHTML = renderPrintersList('all');
        document.getElementById('onlinePrintersList').innerHTML = renderPrintersList('online');
        document.getElementById('offlinePrintersList').innerHTML = renderPrintersList('offline');
        document.getElementById('jobsList').innerHTML = renderJobsList();
        updateJobPrinterSelect();
        updateStats();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tab + 'Tab').classList.add('active');
        event.target.classList.add('active');
    }

    function showNotification(message, type = 'success') {
        const notification = document.createElement('div');
        notification.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            background: ${type === 'error' ? '#ff6b6b' : '#28a745'};

            font-weight: bold;
            z-index: 2000;
            animation: slideDown 0.3s ease-out;
        `;
        notification.textContent = message;
        document.body.appendChild(notification);

        setTimeout(() => {
            notification.remove();
